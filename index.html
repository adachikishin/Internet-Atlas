<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網路圖鑑</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="slot">
            <button id="home"><span class="material-symbols-outlined">home</span></button>
            <div class="search">
                <span class="material-symbols-outlined">search</span>
                <input class="搜尋欄" placeholder="搜尋">
            </div>
            <button id="light_mode"><span class="material-symbols-outlined">light_mode</span></button>
            <button id="dark_mode"><span class="material-symbols-outlined">dark_mode</span></button>
        </div>
        <div class="tags">
            <div class="sort">
                <select id="city" name="city">
                <option value="taipei">依發行日期</option>
                <option value="taichung">依擁有數</option>
                <option value="kaohsiung" selected>隨機</option>
            </select>
            </div>
            
            <ul>
                <button id="全部">全部</button>
                <button id="黏土人">黏土人</button>
            </ul>
            <div class="pages"></div>
        </div>
    </header>
    <main>
        <p></p>
        <div class="photos"></div>
        <div class="pages"></div>
    </main>
    <footer>
        <p></p>
    </footer>
    <script src="js/index.js"></script>
</body>
</html>
