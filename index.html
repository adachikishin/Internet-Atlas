<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網路圖鑑</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <button type="button" class="icon-button" id="home"><span class="material-symbols-outlined">home</span></button>
        <div class="search">
            <button type="button" class="icon-button" id="search"><span class="material-symbols-outlined">search</span></button>
            <input class="搜尋欄" placeholder="搜尋">
        </div>
        <button type="button" class="icon-button" id="light-mode"><span class="material-symbols-outlined">light_mode</span></button>
        <button type="button" class="icon-button" id="dark-mode"><span class="material-symbols-outlined">dark_mode</span></button>
    </header>
    <main>
        <p></p>
        <section class="display">
            <aside>
            </aside>
            <section>
                <div class="page-display">
                    <button class="switch-page">&lt</button>
                    <p class="pages"></p>
                    <button class="switch-page">&gt</button>
                </div>
                <div class="photos"></div>
                <div class="page-display"></div>
            </section>
        </section>
        <dialog id="item-modal">
            <article>
                <img id="img">
                <section>
                    <h1 id="name"></h1>
                    <h2 id="type"></h2>
                    <p id="character"></p>
                    <p id="company"></p>
                    <p id="series"></p>
                    <p id="first"></p>
                    <p id="last"></p>
                    <button type="button" onclick="closeModal()" id="close-modal">x</button>
                </section>
            </article>
        </dialog>
    </main>
    <footer>
        <p></p>
    </footer>
    <script src="js/index.js"></script>
</body>
</html>
