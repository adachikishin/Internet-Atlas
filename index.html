<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網路圖鑑</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <button type="button" class="icon-button" id="home"><span class="material-symbols-outlined">home</span></button>
        <div class="search">
            <button type="button" class="icon-button" id="search"><span class="material-symbols-outlined">search</span></button>
            <input class="搜尋欄" placeholder="搜尋">
        </div>
        <button type="button" class="icon-button" id="light-mode"><span class="material-symbols-outlined">light_mode</span></button>
        <button type="button" class="icon-button" id="dark-mode"><span class="material-symbols-outlined">dark_mode</span></button>
    </header>
    <main>
        <aside class="aside">
            <p class="space"></p>
            <section class="dropdown" id="type">
                <button class="dropdown-button">類別</button>
                <div class="dropdown-list">
                    <button class="dropdown-option" onclick="filterBtn(this)">option 1</button>
                    <button class="dropdown-option" onclick="filterBtn(this)">option 2</button>
                    <button class="dropdown-option" onclick="filterBtn(this)">option 3</button>
                    <button class="dropdown-option" onclick="filterBtn(this)">option 4</button>
                    <button class="dropdown-option" onclick="filterBtn(this)">option 5</button>
                    <button class="dropdown-option" onclick="filterBtn(this)">option 6</button>
                </div>
            </section>
            <section class="dropdown" id="color">
                <button class="dropdown-button">顏色</button>
                <div class="dropdown-list">
                    <button class="dropdown-option" id="red" onclick="filterBtn(this)">option 1</button>
                    <button class="dropdown-option" id="yellow" onclick="filterBtn(this)">option 2</button>
                    <button class="dropdown-option" id="green" onclick="filterBtn(this)">option 3</button>
                    <button class="dropdown-option" id="blue" onclick="filterBtn(this)">option 4</button>
                    <button class="dropdown-option" id="white" onclick="filterBtn(this)">option 5</button>
                    <button class="dropdown-option" id="black" onclick="filterBtn(this)">option 6</button>
                </div>
            </section>
        </aside>
        <section class="display">
            <p class="space"></p>
            <div class="page-display">
                <button class="switch-page" id="left" onclick="lastPage()">&lt</button>
                <button class="pages"></button>
                <button class="switch-page" id="right" onclick="nextPage()">&gt</button>
            </div>
            <div class="photos"></div>
            <div class="page-display">
                <button class="switch-page" onclick="lastPage()">&lt</button>
                <button class="pages"></button>
                <button class="switch-page" onclick="nextPage()">&gt</button>
            </div>
        </section>
        <dialog class="item-modal">
            <article>
                <img id="img">
                <section>
                    <h1 class="name"></h1>
                    <h2 class="type"></h2>
                    <p class="character"></p>
                    <p class="company"></p>
                    <p class="series"></p>
                    <p class="first"></p>
                    <p class="last"></p>
                </sections>
            </article>
        </dialog>
    </main>
    <footer>
        <p></p>
    </footer>
    <script src="js/index.js"></script>
</body>
</html>
