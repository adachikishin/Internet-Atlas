<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網路圖鑑</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <div class="slot">
            <button type="button" class="icon-button" id="home"><span class="material-symbols-outlined">home</span></button>
            <div class="search">
                <button type="button" class="icon-button" id="search"><span class="material-symbols-outlined">search</span></button>
                <input class="搜尋欄" placeholder="搜尋">
            </div>
            <button type="button" class="icon-button" id="light-mode"><span class="material-symbols-outlined">light_mode</span></button>
            <button type="button" class="icon-button" id="dark-mode"><span class="material-symbols-outlined">dark_mode</span></button>
        </div>

        <div id="filter">
            <div class="dropdown-menu">
                <button type="button" class="font-button">排序依據</button>
                <ul class="dropdown-menu-option">
                    <button type="button" class="font-button" id="def">預設</button>
                    <button type="button" class="font-button" id="like">喜歡</button>
                    <button type="button" class="font-button" id="want">想買</button>
                    <button type="button" class="font-button" id="owned">擁有</button>
                </ul>
            </div>
            <ul class="tags">
                <button type="button" class="font-button" id="all">全部</button>
                <button type="button" class="font-button" id="nendoroid">黏土人</button>
            </ul>
            <div class="pages"></div>
        </div>
    </header>
    <main>
        <p></p>
        <div class="photos"></div>
        <div class="pages"></div>
    </main>
    <footer>
        <p></p>
    </footer>
    <script src="js/index.js"></script>
</body>
</html>
